[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-desktop-agent"
version = "3.0.1b"
description = "RTDA Capture Engine prototype for a Windows real-time desktop vision agent."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
  { name = "Adan0423", email = "Atrinidad.a4@gmail.com" },
]
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.8",
  "pydantic>=2.12",
  "pyautogui>=0.9.54",
  "uiautomation>=2.0.29",
  "onnxruntime>=1.28",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
capture = [
  "windows-capture>=2.0.1",
]
gui = [
  "PySide6>=6.10",
]
dev = [
  "pytest>=8.0",
]
ocr = [
  "paddleocr>=3.0",
  "paddlepaddle>=3.0",
]
service = [
  "fastapi>=0.110",
  "uvicorn>=0.28",
]

[project.scripts]
rtda-capture = "rtda.cli.main:main"
rtda-mcp = "rtda.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
